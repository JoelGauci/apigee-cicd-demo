name: Deploy Apigee Proxy

on:
  push:
    branches:
      - main
    paths:
      - 'apiproxy/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: apigee-x-jog
  APIGEE_ORG: apigee-x-jog
  APIGEE_ENV: prod
  APIGEE_HOSTNAME: 34.54.8.132.nip.io
  PROXY_NAME: apigee-cicd-v1
  KVM_NAME: apigee_secrets
  KVM_KEY: secret_demo
  SECRET_NAME: secret_demo
  WIF_PROVIDER: projects/1014194238001/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: apigee-deployer-sa@apigee-x-jog.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy to Apigee X & Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Fetch Secret from Secret Manager
        id: fetch_secret
        run: |
          echo "Fetching secret '${SECRET_NAME}' from GCP Secret Manager..."
          SECRET_VALUE=$(gcloud secrets versions access latest \
            --secret="${SECRET_NAME}" \
            --project="${GCP_PROJECT}")

          # Mask the secret value to prevent accidental disclosure in runner logs
          echo "::add-mask::${SECRET_VALUE}"

          echo "secret_value=${SECRET_VALUE}" >> "$GITHUB_OUTPUT"
          echo "Secret fetched successfully from GCP Secret Manager."

      - name: Synchronize Apigee KVM & Secret Entry
        run: |
          ACCESS_TOKEN="${{ steps.auth.outputs.access_token }}"
          SECRET_VAL="${{ steps.fetch_secret.outputs.secret_value }}"

          echo "Checking if KVM '${KVM_NAME}' exists in environment '${APIGEE_ENV}'..."
          KVM_HTTP_CODE=$(curl --silent -o /dev/null -w "%{http_code}" -X GET \
            "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/environments/${APIGEE_ENV}/keyvaluemaps/${KVM_NAME}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

          if [ "${KVM_HTTP_CODE}" -eq 404 ]; then
            echo "KVM '${KVM_NAME}' not found (HTTP 404). Creating encrypted KVM..."
            CREATE_KVM_RES=$(curl --silent --show-error --fail-with-body -X POST \
              "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/environments/${APIGEE_ENV}/keyvaluemaps" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${KVM_NAME}\", \"encrypted\": true}")
            echo "KVM created: ${CREATE_KVM_RES}"
          elif [ "${KVM_HTTP_CODE}" -eq 200 ]; then
            echo "KVM '${KVM_NAME}' already exists."
          else
            echo "Unexpected HTTP status checking KVM: ${KVM_HTTP_CODE}"
            exit 1
          fi

          echo "Checking if key '${KVM_KEY}' exists in KVM '${KVM_NAME}'..."
          ENTRY_HTTP_CODE=$(curl --silent -o /dev/null -w "%{http_code}" -X GET \
            "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/environments/${APIGEE_ENV}/keyvaluemaps/${KVM_NAME}/entries/${KVM_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

          if [ "${ENTRY_HTTP_CODE}" -eq 200 ]; then
            echo "KVM entry '${KVM_KEY}' exists. Updating entry value..."
            curl --silent --show-error --fail-with-body -X PUT \
              "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/environments/${APIGEE_ENV}/keyvaluemaps/${KVM_NAME}/entries/${KVM_KEY}" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${KVM_KEY}\", \"value\": \"${SECRET_VAL}\"}"
            echo "KVM entry '${KVM_KEY}' updated successfully."
          else
            echo "KVM entry '${KVM_KEY}' does not exist (HTTP ${ENTRY_HTTP_CODE}). Creating new entry..."
            curl --silent --show-error --fail-with-body -X POST \
              "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/environments/${APIGEE_ENV}/keyvaluemaps/${KVM_NAME}/entries" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${KVM_KEY}\", \"value\": \"${SECRET_VAL}\"}"
            echo "KVM entry '${KVM_KEY}' created successfully."
          fi

      - name: Package API Proxy Bundle
        run: |
          echo "Packaging apiproxy bundle..."
          zip -r apiproxy.zip apiproxy -x "*.DS_Store" -x "*__MACOSX*"
          echo "Bundle contents:"
          unzip -l apiproxy.zip

      - name: Import API Proxy Bundle
        id: import_proxy
        run: |
          echo "Importing proxy ${PROXY_NAME} to organization ${APIGEE_ORG}..."
          RESPONSE=$(curl --silent --show-error --fail-with-body -X POST \
            "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/apis?name=${PROXY_NAME}&action=import" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@apiproxy.zip")

          echo "Import API response: ${RESPONSE}"
          REVISION=$(echo "${RESPONSE}" | jq -r '.revision')

          if [ -z "${REVISION}" ] || [ "${REVISION}" = "null" ]; then
            echo "Error: Failed to retrieve revision number from response."
            exit 1
          fi

          echo "Successfully imported revision: ${REVISION}"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Deploy Revision to Environment
        run: |
          REVISION="${{ steps.import_proxy.outputs.revision }}"
          echo "Deploying revision ${REVISION} to environment ${APIGEE_ENV} in org ${APIGEE_ORG}..."

          DEPLOY_RESPONSE=$(curl --silent --show-error --fail-with-body -X POST \
            "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/environments/${APIGEE_ENV}/apis/${PROXY_NAME}/revisions/${REVISION}/deployments?override=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json")

          echo "Deployment response: ${DEPLOY_RESPONSE}"

      - name: Wait for Deployment to be Ready
        run: |
          REVISION="${{ steps.import_proxy.outputs.revision }}"
          echo "Waiting for deployment of revision ${REVISION} to be READY..."

          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS_RESPONSE=$(curl --silent -X GET \
              "https://apigee.googleapis.com/v1/organizations/${APIGEE_ORG}/environments/${APIGEE_ENV}/apis/${PROXY_NAME}/revisions/${REVISION}/deployments" \
              -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}")

            STATE=$(echo "${STATUS_RESPONSE}" | jq -r '.state // empty')
            echo "Attempt $((ATTEMPT+1))/${MAX_ATTEMPTS}: Current state is '${STATE}'"

            if [ "${STATE}" = "READY" ]; then
              echo "Deployment is READY!"
              exit 0
            elif [ "${STATE}" = "ERROR" ]; then
              echo "Deployment failed with error state:"
              echo "${STATUS_RESPONSE}" | jq .
              exit 1
            fi

            ATTEMPT=$((ATTEMPT+1))
            sleep 5
          done

          echo "Warning: Deployment did not reach READY within timeout. Current status:"
          echo "${STATUS_RESPONSE}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Test Dependencies
        run: |
          cd test
          npm install

      - name: Run Apickli BDD Integration Tests
        env:
          APIGEE_HOSTNAME: ${{ env.APIGEE_HOSTNAME }}
          DEMO_SECRET: ${{ steps.fetch_secret.outputs.secret_value }}
        run: |
          cd test
          npm test
